backend:
  name: github
  repo: Oelono/blender-free-asset
  branch: main
  base_url: https://oelono-cms-auth.beenbeen123455678.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
# Relative (NOT "/blender-free-asset/assets/uploads") so saved image paths
# like "assets/uploads/pic.png" work on GitHub Pages AND any custom domain.
public_folder: "assets/uploads"

collections:
  - name: "settings"
    label: "Ad Gate & Key System"
    files:
      - name: "settings"
        label: "Ad Gate & Key System Settings"
        file: "data/settings.json"
        format: "json"
        fields:
          - label: "Download Gate — Ad Slots"
            name: "gate"
            widget: "object"
            fields:
              - label: "Ad Slots (shown in order before every download, replacing the old 4-step flow)"
                name: "steps"
                widget: "list"
                min: 1
                max: 4
                summary: "{{fields.label}} — {{fields.provider}} ({{fields.seconds}}s)"
                fields:
                  - { label: "Internal ID", name: "id", widget: "string", hint: "Unique, no spaces, e.g. slot1" }
                  - { label: "Label shown to visitors", name: "label", widget: "string", default: "Ad" }
                  - label: "Ad Network"
                    name: "provider"
                    widget: "select"
                    options: ["hilltopads", "richads", "custom"]
                    default: "custom"
                  - label: "Slot Type"
                    name: "type"
                    widget: "select"
                    options:
                      - { label: "In-page video (VAST tag — tries to play inline, falls back to a new tab if the ad network blocks it)", value: "vast-video" }
                      - { label: "New-tab link + timed wait (for Direct Link / popunder style ad codes, e.g. HilltopAds Direct Link)", value: "link-dwell" }
                    default: "link-dwell"
                    hint: "Only a real VAST/video ad tag can truly autoplay inline. A HilltopAds \"Direct Link\" is a redirect URL, not a video file — use link-dwell for those."
                  - label: "Ad Code / URL"
                    name: "url"
                    widget: "string"
                    hint: "Paste the ad network's tag URL here. For RichAds-style RTB pre-roll endpoints, do not include ip=/ua= macros — the site fills those in automatically."
                  - label: "Required watch / wait time (seconds)"
                    name: "seconds"
                    widget: "select"
                    options: [30, 60]
                    default: 30
                    hint: "The visitor must watch/wait this long. If they pause or close the ad before this finishes, they are sent back to redo the previous slot."
          - label: "Panda Key System (oelonohub)"
            name: "keySystem"
            widget: "object"
            fields:
              - { label: "Service name", name: "service", widget: "string", default: "oelonohub" }
              - { label: "Whitelist check endpoint", name: "whitelistCheckUrl", widget: "string", default: "https://api.pandauth.com/api/v1/public/whitelist/check", hint: "Called as ?service=...&key=... to verify a key." }
              - { label: "Ads callback base URL", name: "callbackBaseUrl", widget: "string", default: "https://api.pandauth.com/api/v1/api/public/ads/callback/oelonohub", hint: "Base of the Panda callback. Panda appends its own one-time token (t=...) — never hard-code a specific token here, it only works once." }
              - { label: "\"Get Key\" offer / locker URL", name: "getKeyUrl", widget: "string", required: false, hint: "Where the \"Get a key\" button sends visitors (your ad-locker/offer wall page that eventually redirects through the Panda callback above). Leave empty to hide the button." }
              - { label: "Return query param name", name: "returnParamName", widget: "string", default: "key", hint: "When Panda sends the visitor back to this site with the new key, what query param it's in, e.g. https://oelono.github.io/?key=XXXX." }

  - name: "products"
    label: "Products"
    files:
      - name: "products"
        label: "Product Library"
        file: "data/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.title}} — {{fields.library}} / {{fields.category}}"
            fields:
              - label: "Library"
                name: "library"
                widget: "select"
                options: ["blender", "games", "roblox"]
                default: "blender"
                hint: "Which top-level section this shows up in: blender = Blender Assets, games = My Games, roblox = Roblox Assets. All three use the same 4-step ad/download flow."
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Slug / ID", name: "id", widget: "string", hint: "Unique, no spaces, e.g. cyber-samurai-rig" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Characters", "Environments", "Shaders", "Animations", "Assets", "Full Games", "Demos", "Mods", "Scripts", "Models", "Maps"]
                hint: "Pick the category matching this product's Library — Blender: Characters/Environments/Shaders/Animations/Assets. Games: Full Games/Demos/Mods. Roblox: Scripts/Models/Maps."
              - label: "Thumbnail"
                name: "thumbnail"
                widget: "image"
                hint: "Upload an image, or paste an external image URL. This is the main card image."
              - label: "Hover Preview Image (optional)"
                name: "previewImage"
                widget: "image"
                required: false
                hint: "Optional second image shown when the visitor hovers the card. Leave EMPTY unless you really have one — if left empty, the thumbnail simply stays visible on hover."
              - label: "3D Model (GLB / GLTF) — Blender assets only"
                name: "modelUrl"
                widget: "file"
                required: false
                hint: "Upload a .glb or .gltf file. GLB is recommended because it can bundle textures and meshes into one file. Leave empty for Games/Roblox products. Optional — you can use this OR the Preview Video field below instead."
              - label: "Preview Video (MP4) — alternative to the 3D Model"
                name: "previewVideoUrl"
                widget: "file"
                required: false
                hint: "Upload a short .mp4 clip to use as the card's hover preview / preview button instead of a 3D model. Only used when the 3D Model field above is left empty — if both are filled, the 3D Model wins."
              - { label: "Blender Version (Blender assets only)", name: "blenderVersion", widget: "string", required: false, hint: "e.g. 4.2+. Leave empty for Games/Roblox." }
              - label: "Render Engine (Blender assets only)"
                name: "engine"
                widget: "select"
                options: ["Cycles", "Eevee", "Cycles / Eevee"]
                required: false
              - { label: "Platform (Games / Roblox)", name: "platform", widget: "string", required: false, hint: "e.g. \"Windows (.zip)\" for a game, or \"Roblox Studio (.rbxl)\" / \"Roblox Studio (.rbxm)\" for a Roblox asset." }
              - { label: "File Size", name: "fileSize", widget: "string", hint: "e.g. 184 MB" }
              - { label: "License", name: "license", widget: "string", default: "CC0 — Free for personal & commercial use" }
              - label: "Ad Video URL (Step 1 of the download flow, optional)"
                name: "adVideoUrl"
                widget: "file"
                required: false
                hint: "Upload or link an .mp4 to play as the 10-second video ad before sponsor steps. If left empty, an AdSense ad block is shown for 10 seconds instead."
              - label: "Tutorial / Explainer Video (optional)"
                name: "tutorialVideoUrl"
                widget: "file"
                required: false
                hint: "Optional. Upload or link a short .mp4 showing how to download this asset. When set, it plays in a small side panel next to the download popup (muted preview by default; visitors click it to play with sound). Leave empty to hide that panel entirely — it's fully optional, nothing breaks if you skip it."
              - label: "Sponsor Links (Steps 2–4 of the download flow)"
                name: "sponsorLinks"
                widget: "list"
                hint: "Links a visitor clicks through, in order, before the file unlocks. The flow always shows exactly 3 of these (after the video ad) — if you add fewer than 3, they repeat automatically."
                min: 1
                max: 4
                field: { label: "Link", name: "url", widget: "string" }
              - label: "Google Drive Link"
                name: "driveLink"
                widget: "string"
                hint: "Fallback file location — used if Direct Download URL below is empty."
              - label: "Direct Download URL (optional, preferred)"
                name: "downloadUrl"
                widget: "string"
                required: false
                hint: "A direct file link (e.g. your own host, or a GitHub Release asset). If set, the final button downloads this instead of opening Google Drive."
              - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
